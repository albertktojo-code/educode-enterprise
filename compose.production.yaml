services:
  db:
    ports: []
  redis:
    ports: []
  backend:
    ports: []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Defina PUBLIC_BASE_URL HTTPS}
      DEPLOYMENT_STRATEGY: ${DEPLOYMENT_STRATEGY:-blue_green}
      REVERSE_PROXY_ENABLED: "true"
      MAINTENANCE_ACCESS_MODE: ${MAINTENANCE_ACCESS_MODE:-available}
      REQUIRE_RELEASE_BACKUP: "true"
      REQUIRE_RELEASE_APPROVAL: "true"
      KUBERNETES_ENABLED: ${KUBERNETES_ENABLED:-false}
      GITOPS_ENABLED: ${GITOPS_ENABLED:-false}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-educode}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-educode}
      S3_USE_SSL: ${S3_USE_SSL:-true}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  worker-ai:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  worker-documents:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  worker-analytics:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  worker-default:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  frontend:
    ports: []
    environment:
      VITE_API_URL: ${VITE_API_URL:?Defina a URL pública da API}
    command: npm run preview -- --host 0.0.0.0 --port 5173
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/educode.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Defina TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Defina TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    restart: unless-stopped
