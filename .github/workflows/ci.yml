name: EduCode CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: educode_test
          POSTGRES_USER: educode
          POSTGRES_PASSWORD: educode_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U educode -d educode_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://educode:educode_test_password@localhost:5432/educode_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-secret-with-more-than-thirty-two-characters
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
      INSTITUTIONAL_ASSET_STORAGE_PATH: /tmp/educode-ci-institutional-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install .
      - run: python -m compileall -q app alembic/versions
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: >-
          mypy app/core/config.py app/core/middleware.py app/operations
          app/services/platform.py app/services/observability.py
          app/services/infrastructure.py app/services/object_storage.py
          --ignore-missing-imports --allow-untyped-defs --allow-incomplete-defs
          --disable-error-code=import-untyped --disable-error-code=attr-defined
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build backend frontend
      - run: docker compose --profile observability config >/dev/null
      - run: docker compose --profile cloud config >/dev/null


  integration-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build db redis backend worker-observability
      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs backend --tail 200
          exit 1
      - name: Validate Prometheus exposition
        run: curl --fail --silent http://localhost:8000/api/v1/observability/metrics | grep educode_http_requests_total
      - name: Run non-destructive smoke test
        env:
          EDUCODE_BASE_URL: http://localhost:8000
          INITIAL_ADMIN_EMAIL: admin@educode.com
          INITIAL_ADMIN_PASSWORD: Admin@123456
        run: python scripts/smoke_test.py
      - if: always()
        run: docker compose down --remove-orphans
