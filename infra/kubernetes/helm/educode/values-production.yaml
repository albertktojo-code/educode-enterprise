global: {environment: production}
ingress: {host: educode.example.org}
backend:
  replicas: 3
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 20, targetCPUUtilizationPercentage: 65, targetMemoryUtilizationPercentage: 70}
frontend: {replicas: 3}
workers:
  ai: {replicas: 3, queue: ai}
  documents: {replicas: 2, queue: documents}
  analytics: {replicas: 2, queue: analytics}
  default: {replicas: 2, queue: default}
  observability: {replicas: 1, queue: observability}
storage:
  provider: s3
  objectStorage: {endpoint: "", bucket: educode-production, region: sa-east-1, prefix: educode, useSSL: true}
