global:
  environment: homologation
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  existingSecret: educode-secrets
  configMapName: educode-config

images:
  backend:
    repository: ghcr.io/example/educode-backend
    tag: "14.0.0"
  frontend:
    repository: ghcr.io/example/educode-frontend
    tag: "14.0.0"

backend:
  replicas: 2
  port: 8000
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicas: 2
  port: 80
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

workers:
  ai: {replicas: 2, queue: ai}
  documents: {replicas: 2, queue: documents}
  analytics: {replicas: 2, queue: analytics}
  default: {replicas: 1, queue: default}
  observability: {replicas: 1, queue: observability}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: educode

ingress:
  enabled: true
  className: nginx
  host: educode.example.org
  tls:
    enabled: true
    secretName: educode-tls

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

storage:
  provider: s3
  objectStorage:
    endpoint: ""
    bucket: educode
    region: us-east-1
    prefix: educode
    useSSL: true
  local:
    enabled: false
    size: 20Gi
    storageClassName: ""

externalServices:
  databaseUrlSecretKey: DATABASE_URL
  redisUrlSecretKey: REDIS_URL

backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 30

podDisruptionBudget:
  enabled: true
