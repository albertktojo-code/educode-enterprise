apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "educode.fullname" . }}-backend
  labels:
    {{- include "educode.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ .Values.global.configMapName }}}
            - secretRef: {name: {{ .Values.global.existingSecret }}}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {httpGet: {path: /api/v1/health/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health/live, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "educode.fullname" . }}-backend
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  ports: [{name: http, port: 8000, targetPort: http}]
