[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "educode-enterprise-backend"
version = "0.16.11.6"
description = "Backend do EduCode Enterprise 2.0 — aprendizagem adaptativa e trilhas personalizadas"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0", "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.41,<2.2", "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0", "pydantic-settings>=2.10,<3.0",
  "pgvector>=0.4,<1.0", "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.10,<3.0", "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0", "httpx>=0.28,<1.0",
  "pymupdf>=1.26,<2.0",
  "numpy>=2.0,<3.0", "scipy>=1.15,<2.0",
  "matplotlib>=3.10,<4.0", "python-docx>=1.2,<2.0", "reportlab>=4.4,<5.0",
  "openpyxl>=3.1,<4.0",
  "redis>=5.2,<7.0",
  "boto3>=1.35,<2.0",
  "opentelemetry-api>=1.36,<2.0", "opentelemetry-sdk>=1.36,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1.0",
  "pytest>=8.4,<9.0", "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.12,<1.0", "mypy>=1.16,<2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
