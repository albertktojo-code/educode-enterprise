name: educode-enterprise

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educode}
      POSTGRES_USER: ${POSTGRES_USER:-educode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educode_dev_password}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-educode} -d ${POSTGRES_DB:-educode}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["cloud"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-educode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-educode-minio-change-this-password}
    ports:
      - "${MINIO_API_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_EXTERNAL_PORT:-9001}:9001"
    volumes:
      - object_storage:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    profiles: ["cloud"]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >-
      /bin/sh -c "mc alias set educode http://minio:9000
      ${MINIO_ROOT_USER:-educode} ${MINIO_ROOT_PASSWORD:-educode-minio-change-this-password} &&
      mc mb --ignore-existing educode/${S3_BUCKET_NAME:-educode} &&
      mc version enable educode/${S3_BUCKET_NAME:-educode} &&
      exit 0"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educode}:${POSTGRES_PASSWORD:-educode_dev_password}@db:5432/${POSTGRES_DB:-educode}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
      - creative_storage:/app/storage/creative
      - institutional_asset_storage:/app/storage/institutional-assets
      - backup_storage:/app/storage/backups
      - ./storage/auth-mail-outbox:/app/storage/auth-mail-outbox
      - object_storage_local:/app/storage/objects
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 15

  worker-ai:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educode}:${POSTGRES_PASSWORD:-educode_dev_password}@db:5432/${POSTGRES_DB:-educode}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_QUEUE: ai
      WORKER_NAME: worker-ai
    command: python -m app.workers.main --queue ai --name worker-ai
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
      - creative_storage:/app/storage/creative
      - institutional_asset_storage:/app/storage/institutional-assets
      - backup_storage:/app/storage/backups
      - object_storage_local:/app/storage/objects
    init: true
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-documents:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educode}:${POSTGRES_PASSWORD:-educode_dev_password}@db:5432/${POSTGRES_DB:-educode}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_QUEUE: documents
      WORKER_NAME: worker-documents
    command: python -m app.workers.main --queue documents --name worker-documents
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
      - creative_storage:/app/storage/creative
      - institutional_asset_storage:/app/storage/institutional-assets
      - backup_storage:/app/storage/backups
      - object_storage_local:/app/storage/objects
    init: true
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-analytics:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educode}:${POSTGRES_PASSWORD:-educode_dev_password}@db:5432/${POSTGRES_DB:-educode}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_QUEUE: analytics
      WORKER_NAME: worker-analytics
    command: python -m app.workers.main --queue analytics --name worker-analytics
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
      - creative_storage:/app/storage/creative
      - institutional_asset_storage:/app/storage/institutional-assets
      - backup_storage:/app/storage/backups
      - object_storage_local:/app/storage/objects
    init: true
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-default:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educode}:${POSTGRES_PASSWORD:-educode_dev_password}@db:5432/${POSTGRES_DB:-educode}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_QUEUE: default
      WORKER_NAME: worker-default
    command: python -m app.workers.main --queue default --name worker-default
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
      - creative_storage:/app/storage/creative
      - institutional_asset_storage:/app/storage/institutional-assets
      - backup_storage:/app/storage/backups
      - object_storage_local:/app/storage/objects
    init: true
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-observability:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educode}:${POSTGRES_PASSWORD:-educode_dev_password}@db:5432/${POSTGRES_DB:-educode}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: python -m app.workers.observability
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
      - creative_storage:/app/storage/creative
      - institutional_asset_storage:/app/storage/institutional-assets
      - backup_storage:/app/storage/backups
      - object_storage_local:/app/storage/objects
    init: true
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@educode.com}
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-5173}:5173"
    init: true
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-educode-postgres-data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-educode-redis-data}
  frontend_node_modules:
    name: ${FRONTEND_NODE_MODULES_VOLUME_NAME:-educode-frontend-node-modules}
  document_storage:
    name: ${DOCUMENT_STORAGE_VOLUME_NAME:-educode-document-storage}
  creative_storage:
    name: ${CREATIVE_STORAGE_VOLUME_NAME:-educode-creative-storage}
  institutional_asset_storage:
    name: ${INSTITUTIONAL_ASSET_STORAGE_VOLUME_NAME:-educode-institutional-assets}

  object_storage_local:
    name: ${OBJECT_STORAGE_LOCAL_VOLUME_NAME:-educode-object-storage-local}
  backup_storage:
    name: ${BACKUP_STORAGE_VOLUME_NAME:-educode-backup-storage}
  object_storage:
    name: ${OBJECT_STORAGE_VOLUME_NAME:-educode-object-storage}
  prometheus_data:
    name: ${PROMETHEUS_VOLUME_NAME:-educode-prometheus-data}
  grafana_data:
    name: ${GRAFANA_VOLUME_NAME:-educode-grafana-data}
